# Texas Instruments AM69 octa core 32GB 32TOPS GBE USB3 OSPI DisplayPort HDMI

BOARD_NAME="SK-AM69"
BOARD_VENDOR="ti"
BOARDFAMILY="k3"
BOARD_MAINTAINER="glneo"
INTRODUCED="2024"
BOOT_SOC="j784s4"
BOOTCONFIG="am69_sk_a72_defconfig"
BOOTFS_TYPE="fat"
BOOT_FDT_FILE="ti/k3-am69-sk.dts"
TIBOOT3_BOOTCONFIG="am69_sk_r5_defconfig"
TIBOOT3_FILE="tiboot3-j784s4-hs-fs-evm.bin"
DEFAULT_CONSOLE="serial"
KERNEL_TARGET="vendor,vendor-rt,vendor-edge,edge"
KERNEL_TEST_TARGET="vendor"
SERIALCON="ttyS2"
ATF_PLAT="k3"
ATF_BOARD="j784s4"
ATF_ARGS="K3_USART=0x8"
OPTEE_ARGS="CFG_CONSOLE_UART=0x8"
OPTEE_PLATFORM="k3-j784s4"

# Board files load before interactive branch/release selection. Register the
# extension now; its image hook only runs for Noble images using TI's GPU stack.
enable_extension "ti-gpu-wayland-backport"
SK_AM69_TI_GPU="no"

function post_family_config__sk_am69_ti_gpu() {
	# Use the matching TI kernel/userspace pair after branch and release selection.
	# Mainline images retain the upstream powervr driver and its firmware below.
	case "${BRANCH}:${RELEASE}" in
		vendor:noble | vendor-rt:noble | vendor-edge:noble | vendor:trixie | vendor-rt:trixie | vendor-edge:trixie)
			SK_AM69_TI_GPU="yes"
			TI_PACKAGES+=(
				"ti-img-rogue-driver-j784s4-dkms"
				"ti-img-rogue-umlibs-j784s4"
				"ti-img-rogue-tools-j784s4"
				"ti-img-rogue-firmware-j784s4"
			)
			;;
	esac
}

function post_repo_customize_image__020_sk_am69_gpu_compiler() {
	[[ "${SK_AM69_TI_GPU}" == "yes" ]] || return 0
	# Noble defaults to GCC 13, which cannot compile these 6.18 kernel headers.
	# Install the compiler before the TI package's DKMS postinst runs.
	chroot_sdcard_apt_get --no-install-recommends install gcc-14
	run_host_command_logged install -D -m 644 \
		"${SRC}/packages/bsp/sk-am69/ti-img-rogue-driver.conf" \
		"${SDCARD}/etc/dkms/ti-img-rogue-driver.conf"
}

function post_repo_customize_image__900_sk_am69_gpu_driver() {
	[[ "${SK_AM69_TI_GPU}" == "yes" ]] || return 0
	# Configure the image, not the release-independent BSP: only images with
	# TI's userspace should select pvrsrvkm instead of the upstream driver.
	local package
	for package in ti-img-rogue-driver-j784s4-dkms ti-img-rogue-umlibs-j784s4 ti-img-rogue-firmware-j784s4; do
		chroot_sdcard "test \"\$(dpkg-query -W -f='\${db:Status-Status}' ${package})\" = installed"
	done
	run_host_command_logged install -D -m 644 \
		"${SRC}/packages/bsp/sk-am69/ti-gpu-modprobe.conf" \
		"${SDCARD}/etc/modprobe.d/ti-gpu.conf"
	run_host_command_logged install -D -m 644 \
		"${SRC}/packages/bsp/sk-am69/ti-gpu-modules.conf" \
		"${SDCARD}/etc/modules-load.d/ti-gpu.conf"
}

function post_family_tweaks_bsp__sk_am69_displayport_firmware() {
	# MHDP is built in and requests firmware before the root filesystem mounts.
	# The small armbian-firmware package does not contain this Cadence blob.
	# Use firmware/updates to avoid owning a path from armbian-firmware-full.
	# Board BSP assets are hashed automatically for package cache invalidation.
	run_host_command_logged install -D -m 644 \
		"${SRC}/packages/bsp/sk-am69/firmware/cadence/mhdp8546.bin" \
		"${destination}/lib/firmware/updates/cadence/mhdp8546.bin"
	run_host_command_logged install -D -m 644 \
		"${SRC}/packages/bsp/sk-am69/firmware/cadence/LICENCE.cadence" \
		"${destination}/usr/share/doc/armbian-mhdp8546-firmware/copyright"
	run_host_command_logged install -D -m 755 \
		"${SRC}/packages/bsp/sk-am69/mhdp8546-initramfs-firmware" \
		"${destination}/etc/initramfs-tools/hooks/mhdp8546-firmware"
}

function post_family_tweaks_bsp__sk_am69_gpu_firmware() {
	# The upstream powervr driver uses this BVNC-specific firmware, rather than
	# the rgx.fw.* blobs consumed by TI's out-of-tree pvrsrvkm driver.
	run_host_command_logged install -D -m 644 \
		"${SRC}/packages/bsp/sk-am69/firmware/powervr/rogue_36.53.104.796_v1.fw" \
		"${destination}/lib/firmware/updates/powervr/rogue_36.53.104.796_v1.fw"
	run_host_command_logged install -D -m 644 \
		"${SRC}/packages/bsp/sk-am69/firmware/powervr/LICENSE.powervr" \
		"${destination}/usr/share/doc/armbian-powervr-firmware/copyright"
}
